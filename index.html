<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多維賽事量化分析</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: #05070c;
      color: white;
    }

    .hero {
      position: relative;
      min-height: 900px;
      overflow: hidden;

      background:
        radial-gradient(circle at 20% 20%, rgba(27, 80, 160, 0.28), transparent 35%),
        radial-gradient(circle at 80% 30%, rgba(29, 110, 90, 0.20), transparent 35%),
        linear-gradient(
          180deg,
          #07101d 0%,
          #050a12 55%,
          #020305 100%
        );
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          90deg,
          transparent 0%,
          rgba(255,255,255,0.025) 50%,
          transparent 100%
        );

      animation: backgroundMove 8s linear infinite;
    }

    .hero-glow {
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: rgba(37, 132, 255, 0.10);
      filter: blur(80px);

      top: 120px;
      right: -80px;

      animation: glowFloat 6s ease-in-out infinite;
    }

    .hero-inner {
      position: relative;
      z-index: 2;

      width: min(1100px, 90%);
      margin: 0 auto;

      min-height: 900px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

.hero-content {
  width: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  gap: 28px;
}

.hero-title {
  margin: 0;
  font-size: clamp(56px, 7vw, 92px);
  line-height: 1.05;
  font-weight: 900;
  letter-spacing: -2px;
  color: #ffffff;
}

.hero-title span {
  display: inline-block;
  margin-top: 6px;

  background: linear-gradient(
    90deg,
    #ffffff 0%,
    #ffd76a 35%,
    #8dff72 100%
  );

  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;

  animation: titleRise 0.9s ease-out both;
}

@keyframes titleRise {
  from {
    opacity: 0;
    transform: translateY(24px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}
    
.sponsor-badge {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 14px;
  padding: 18px 28px;
  border-radius: 999px;
  border: 1px solid rgba(255, 215, 120, 0.65);

  background: linear-gradient(
    135deg,
    rgba(255, 210, 90, 0.16),
    rgba(255, 255, 255, 0.05)
  );

  box-shadow:
    0 0 0 1px rgba(255,255,255,0.03) inset,
    0 0 30px rgba(255,190,60,0.12);

  overflow: hidden;
  animation: badgePulse 3s ease-in-out infinite;
}

.sponsor-badge::before {
  content: "";
  position: absolute;
  top: -50%;
  left: -40%;
  width: 35%;
  height: 200%;

  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,0.65),
    transparent
  );

  transform: rotate(18deg);
  animation: badgeShine 3.5s ease-in-out infinite;
}

.sponsor-icon {
  position: relative;
  z-index: 2;
  width: 38px;
  height: 38px;
  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  color: #1a1200;
  background: linear-gradient(135deg, #fff1a8, #f6c84c);

  font-size: 20px;
  font-weight: 900;

  box-shadow: 0 0 18px rgba(255,213,100,0.35);
}

.sponsor-text {
  position: relative;
  z-index: 2;

  display: flex;
  align-items: center;
  gap: 8px;

  font-size: 20px;
  font-weight: 800;
}

.sponsor-title {
  color: #ffd66b;
}

.sponsor-divider {
  color: rgba(255,255,255,0.35);
}

.sponsor-sub {
  color: #ffffff;
}

@keyframes badgeShine {
  0% {
    left: -40%;
    opacity: 0;
  }

  20% {
    opacity: 1;
  }

  50% {
    left: 120%;
    opacity: 0;
  }

  100% {
    left: 120%;
    opacity: 0;
  }
}

@keyframes badgePulse {
  0%, 100% {
    transform: scale(1);
    box-shadow:
      0 0 24px rgba(255,190,60,0.10);
  }

  50% {
    transform: scale(1.025);
    box-shadow:
      0 0 38px rgba(255,190,60,0.25);
  }
}

    @keyframes backgroundMove {
      0% {
        transform: translateX(-20%);
      }

      50% {
        transform: translateX(20%);
      }

      100% {
        transform: translateX(-20%);
      }
    }

    @keyframes glowFloat {
      0%, 100% {
        transform: translateY(0);
        opacity: 0.7;
      }

      50% {
        transform: translateY(30px);
        opacity: 1;
      }
    }

    @media (max-width: 768px) {

      .hero {
        min-height: 820px;
      }

      .hero-inner {
        min-height: 820px;
        width: 92%;
      }

      .hero-glow {
        width: 320px;
        height: 320px;
        right: -120px;
      }

     .hero-content {
  gap: 20px;
}

.hero-title {
  font-size: 52px;
  line-height: 1.08;
  letter-spacing: -1px;
} 

.hero-copy {
  margin-top: 6px;
}

.hero-question {
  margin: 0 0 8px;
  font-size: 20px;
  font-weight: 800;
  color: #ffffff;
  line-height: 1.4;
}

.hero-desc {
  margin: 0;
  font-size: 16px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.72);
  line-height: 1.6;
}      
       
    }

.brand-header {
  position: absolute;
  top: 24px;
  left: 24px;
  z-index: 20;

  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-logo {
  width: 34px;
  height: 34px;
  border-radius: 10px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: linear-gradient(135deg, #ffd76a, #bfff55);
  color: #07101d;

  font-size: 18px;
  font-weight: 900;
}

.brand-name {
  color: #ffffff;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 0.5px;
}

  .main-brand-logo {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 22px;
  position: relative;
  z-index: 5;
}

.main-brand-logo img {
  width: 260px;
  max-width: 72vw;
  height: auto;
  display: block;
}
    
  </style>
</head>

<body>

  <section class="hero">

    <div class="hero-glow"></div>

    <div class="hero-inner">

      <div class="hero-content">

        <div class="main-brand-logo">
  <img src="habao-logo.png" alt="哈寶足球 AI">
</div>  

  <div class="sponsor-badge">
    <span class="sponsor-icon">✦</span>

    <div class="sponsor-text">
      <span class="sponsor-title">贊助商支持</span>
      <span class="sponsor-divider">｜</span>
      <span class="sponsor-sub">分析不用你花錢</span>
    </div>

    </div>
    
    <h1 class="hero-title">
  多維賽事<br>
  <span>量化分析</span>
</h1>

<div class="hero-copy">
  <p class="hero-question">玩球最怕選了又猶豫？</p>
  <p class="hero-desc">全方位分析，讓數據替你的判斷把關</p>
</div>
        
  </div>

</div>

  </section>

</body>
</html>
